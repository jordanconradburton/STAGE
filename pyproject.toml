[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stage"
version = "0.1.0"
description = "STAGE: graph-temporal RSS localization of a single drone from a network of stationary ground sensors"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# Tested with Python 3.9-3.13, torch 2.0-2.14, torch-geometric 2.3-2.8.1, numpy 1.26-2.5,
# pandas 1.5-3.0, matplotlib 3.5-3.11, tqdm 4.60-4.67. torch 2.0-2.2 also work, but only with
# numpy < 2, so the floor is torch 2.3. torch-geometric < 2.3 needs the torch-sparse extension.
dependencies = [
    "torch>=2.3",
    "torch-geometric>=2.3",
    "numpy>=1.26",
    "pandas>=1.5",
    "matplotlib>=3.5",
    "tqdm>=4.60",
]

[project.scripts]
stage = "stage.cli:main"

[tool.setuptools.packages.find]
include = ["stage*"]
